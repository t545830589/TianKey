name: tian_key
description: "Tian Key V11 Mazda Axela BLE Controller App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.31.0   # 蓝牙 BLE 搜索与通信
  vibration: ^2.0.0            # 赛博按键轻微震动反馈
  shared_preferences: ^2.2.2   # 管理员密码与设置本地存储

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/borrow_page_bg.png
    - assets/home_car_bg.png
    - assets/home_controls_bg.png
    - assets/logo_footer_bg.png
    - assets/popup_admin_auth.png
    - assets/popup_device_name.png
    - assets/popup_edit_pwd.png
    - assets/popup_reset_pwd.png
    - assets/popup_sound.png
    - assets/popup_time_sync.png
    - assets/settings_auto_connect.png
    - assets/settings_page_bg.png
