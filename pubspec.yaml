name: tian_key

description: "Tian Key V11 personal Mazda Axela BLE car key app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.2.3
  flutter_blue_plus: 1.36.8
  crypto: 3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/borrow_page_bg.png
    - assets/home_car_bg.png
    - assets/home_controls_bg.png
    - assets/logo_footer_bg.png
    - assets/popup_admin_auth.png
    - assets/popup_device_name.png
    - assets/popup_edit_pwd.png
    - assets/popup_reset_pwd.png
    - assets/popup_sound.png
    - assets/popup_time_sync.png
    - assets/settings_auto_connect.png
    - assets/settings_page_bg.png
