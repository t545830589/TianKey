name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. 配置 Java 17 环境
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. 配置最新的稳定版 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # 3. 使用你的项目名称 tian_key 自动补全现代 Android 配置文件
      - name: Regenerate Android Project Files
        run: flutter create . --platforms=android --project-name=tian_key

      # 4. 安装项目依赖（会完美读取你写好的所有依赖和资源）
      - name: Install Dependencies
        run: flutter pub get

      # 5. 打包生成 APK
      - name: Build APK
        run: flutter build apk --release
