name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianjin-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --project-name=tianjin --no-pub .
          fi
          rm -rf test
          rm -f analysis_options.yaml

          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 21/' android/app/build.gradle

          if ! grep -q 'flutter_blue_plus_android' android/build.gradle; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle')
          s = p.read_text()
          prefix = """// Compatibility bridge for flutter_blue_plus_android 7.0.4 on Flutter 3.19.6.\ngradle.beforeProject { project ->\n    if (project.name == 'flutter_blue_plus_android') {\n        project.ext.flutter = [\n            compileSdkVersion: 34,\n            minSdkVersion: 21,\n            targetSdkVersion: 34,\n            ndkVersion: '25.1.8937393'\n        ]\n    }\n}\n\n"""
          if 'flutter_blue_plus_android' not in s:
              p.write_text(prefix + s)
          PY
          fi

          if ! grep -q 'android.permission.BLUETOOTH_SCAN' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />' android/app/src/main/AndroidManifest.xml
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="28" />' android/app/src/main/AndroidManifest.xml
          fi

          grep -q 'minSdkVersion 21' android/app/build.gradle
          grep -q 'android.permission.BLUETOOTH_SCAN' android/app/src/main/AndroidManifest.xml
          grep -q 'flutter_blue_plus_android' android/build.gradle
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f lib/main.dart
          test -f lib/ble_service.dart

      - name: Set app icon and name
        shell: bash
        run: |
          pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          import os, glob

          src = 'assets/app_icon.png'
          if not os.path.exists(src):
              print('No app_icon.png found, skipping')
              exit(0)

          img = Image.open(src)
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out_dir = f'android/app/src/main/res/{folder}'
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(out_dir, 'ic_launcher.png'))
              print(f'  {folder}/ic_launcher.png ({size}x{size})')

          print('App icon set to TIANJIN')
          PY

          # Set app name to TIANJIN
          sed -i 's/android:label="[^"]*"/android:label="TIANJIN"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application code only
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIANJIN-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
