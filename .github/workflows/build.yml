name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # 重新生成基础安卓配置
      - name: Regenerate Android Project Files
        run: flutter create . --platforms=android --project-name=tiankey

      # 【终极防错修复】：直接把导致报错的错误代码替换掉，并升级相关版本
      - name: Fix Android Configurations
        run: |
          # 1. 精准替换触发报错的 kotlin 引用（直接写死版本号，避免变量未定义）
          sed -i 's/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"/implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"/' android/app/build.gradle
          # 2. 升级最低安卓版本支持，否则蓝牙库无法编译
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          # 3. 升级编译 SDK 版本为 34
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
