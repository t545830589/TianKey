name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiankey-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --project-name=tiankey --no-pub .
          fi
          # flutter create generates a default test and analysis_options.yaml.
          # This repository intentionally has no flutter_test/flutter_lints dependencies;
          # remove generated template files so they cannot enter analysis or conflict with the app.
          rm -rf test
          rm -f analysis_options.yaml

          # flutter_blue_plus 1.36.8 requires Android API 21+ and Android 12 BLE permissions.
          sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 21/' android/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = '''    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="28" />
'''
          if 'android.permission.BLUETOOTH_SCAN' not in text:
              text = text.replace('<application', permissions + '    <application', 1)
              manifest.write_text(text)
          PY

          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f lib/main.dart
          test -f lib/ble_service.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application code only
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TianKey-V11-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
