name: Build APK

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable


      # 如果没有Android目录，自动创建
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=tiankey
          fi


      - name: Flutter Pub Get
        run: flutter pub get


      - name: Build APK
        run: flutter build apk --release
