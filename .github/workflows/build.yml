name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      # 核心修复：自动生成 Android 配置文件，解决报错
      - name: Create Android Platform
        run: flutter create . --platforms=android --project-name=tiankey

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
