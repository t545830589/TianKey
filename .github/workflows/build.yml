name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate Android Project Files
        run: flutter create . --platforms=android --project-name=tiankey

      # 自动修复安卓底层版本号
      - name: Fix minSdkVersion
        run: sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle

      - name: Build APK Release
        run: flutter build apk --release

      # 我帮您升级到了新版 v4，完美解决刚才的报错
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
