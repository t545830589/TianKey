name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.16.9
          channel: stable

      - name: Generate Android Platform Safely
        run: |
          flutter create temp_project --platforms=android --project-name=tiankey
          cp -r temp_project/android ./
          rm -rf temp_project

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
