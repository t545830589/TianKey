name: Build APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Remove old Android project
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "发现旧的 android/ 工程，删除后重新生成。"
            rm -rf android
          else
            echo "当前仓库没有 android/ 工程，直接生成。"
          fi

      - name: Generate clean Android project
        shell: bash
        run: |
          flutter create . \
            --platforms=android \
            --project-name=tiankey \
            --org=com.tiankey

      - name: Remove generated sample widget test
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Flutter clean
        run: flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Test
        run: flutter test

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TianKey-V11-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
