name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiankey-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Prepare Android project
        shell: bash
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --project-name=tiankey .
          fi
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TianKey-V11-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
